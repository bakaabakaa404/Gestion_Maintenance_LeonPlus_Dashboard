<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GMAO leon</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">
  <!-- Sidebar: persistent on desktop, off-canvas drawer below 1024px -->
  <aside class="sidebar" id="sidebar" aria-label="Navigation principale">
    <div class="side-brand">
      <div class="brand-logo" id="brandLogo">
        <img src="logo.png" alt="Logo de l'entreprise" id="logoImg">
        <i data-lucide="heart-pulse" class="brand-fallback" aria-hidden="true"></i>
      </div>
      <div class="brand-text">
        <strong>GMAO leon</strong>
        <span>Maintenance biomédicale</span>
      </div>
      <button class="icon-btn side-close" id="sideClose" type="button" aria-label="Fermer le menu"><i data-lucide="x" aria-hidden="true"></i></button>
    </div>

    <nav class="side-nav" id="sideNav">
      <div class="nav-group">
        <a href="#/apercu" data-page="apercu"><i data-lucide="layout-dashboard" aria-hidden="true"></i><span>Vue d'ensemble</span><b class="nav-count" data-count="actions"></b></a>
      </div>
      <div class="nav-group">
        <p class="nav-label">Maintenance</p>
        <a href="#/equipements" data-page="equipements"><i data-lucide="stethoscope" aria-hidden="true"></i><span>Équipements</span><b class="nav-count" data-count="down"></b></a>
        <a href="#/pannes" data-page="pannes"><i data-lucide="triangle-alert" aria-hidden="true"></i><span>Pannes</span><b class="nav-count" data-count="openPannes"></b></a>
        <a href="#/preventif" data-page="preventif"><i data-lucide="calendar-check" aria-hidden="true"></i><span>Maintenance préventive</span><b class="nav-count" data-count="prevLate"></b></a>
        <a href="#/ot" data-page="ot"><i data-lucide="clipboard-list" aria-hidden="true"></i><span>Ordres de travail</span><b class="nav-count" data-count="otLate"></b></a>
      </div>
      <div class="nav-group">
        <p class="nav-label">Gestion</p>
        <a href="#/services" data-page="services"><i data-lucide="building-2" aria-hidden="true"></i><span>Services</span></a>
        <a href="#/equipe" data-page="equipe"><i data-lucide="users" aria-hidden="true"></i><span>Équipe</span></a>
        <a href="#/pieces" data-page="pieces"><i data-lucide="package" aria-hidden="true"></i><span>Pièces et stock</span><b class="nav-count" data-count="lowStock"></b></a>
        <a href="#/couts" data-page="couts"><i data-lucide="wallet" aria-hidden="true"></i><span>Coûts</span></a>
      </div>
      <div class="nav-group">
        <p class="nav-label">Référence</p>
        <a href="#/guide" data-page="guide"><i data-lucide="book-open" aria-hidden="true"></i><span>Guide technique</span></a>
        <a href="#/donnees" data-page="donnees"><i data-lucide="database" aria-hidden="true"></i><span>Données et import</span></a>
      </div>
    </nav>

    <div class="side-foot">
      <div class="source-card" id="sourceCard"></div>
      <div class="side-foot-actions">
        <button class="side-btn" id="btnTheme" type="button"><i data-lucide="sun-moon" aria-hidden="true"></i><span>Thème</span></button>
        <button class="side-btn collapse-btn" id="btnCollapse" type="button" aria-pressed="false"><i data-lucide="panel-left" aria-hidden="true"></i><span>Réduire</span></button>
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <div class="main" id="main">
    <header class="topbar">
      <div class="topbar-row">
        <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="sidebar"><i data-lucide="menu" aria-hidden="true"></i></button>
        <div class="page-head">
          <nav class="crumbs" aria-label="Fil d'Ariane" id="crumbs"></nav>
          <h1 id="pageTitle">Vue d'ensemble</h1>
          <p id="pageDesc" class="page-desc"></p>
        </div>
        <div class="top-actions">
          <button class="btn icon-only" id="btnPrint" type="button" aria-label="Imprimer la page" title="Imprimer"><i data-lucide="printer" aria-hidden="true"></i></button>
          <label class="btn"><i data-lucide="upload" aria-hidden="true"></i><span>Importer Excel</span><input type="file" id="file" accept=".xlsx,.xlsm,.xls,.ods"></label>
          <button class="btn primary" id="btnNewPanne" type="button"><i data-lucide="plus" aria-hidden="true"></i><span>Déclarer une panne</span></button>
        </div>
      </div>
      <div class="filterbar" role="group" aria-label="Filtres">
        <div class="field">
          <label for="fPeriod"><i data-lucide="calendar-clock" aria-hidden="true"></i>Période</label>
          <select id="fPeriod">
            <option value="30d">30 derniers jours</option>
            <option value="3m">3 derniers mois</option>
            <option value="12m">12 derniers mois</option>
            <option value="ytd">Année en cours</option>
            <option value="all">Toute la période</option>
            <option value="custom">Personnalisée…</option>
          </select>
        </div>
        <div class="field custom-dates" id="customDates" hidden>
          <label for="fFrom">Du</label><input type="date" id="fFrom">
          <label for="fTo">au</label><input type="date" id="fTo">
        </div>
        <div class="field">
          <label for="fZone"><i data-lucide="building-2" aria-hidden="true"></i>Service</label>
          <select id="fZone"></select>
        </div>
        <div class="field">
          <label for="fModel"><i data-lucide="cpu" aria-hidden="true"></i>Modèle</label>
          <select id="fModel"></select>
        </div>
        <span class="period-text" id="periodText"></span>
      </div>
    </header>

    <div id="notices"></div>
    <main class="content" id="content" tabindex="-1"></main>
  </div>
</div>

<!-- Equipment detail: native modal dialog styled as a right-hand sheet -->
<dialog class="sheet" id="sheet" aria-labelledby="sheetTitle" closedby="any">
  <div class="sheet-inner" id="sheetBody"></div>
</dialog>

<!-- Add / edit form: Esc asks before discarding unsaved changes, no light dismiss -->
<dialog class="modal" id="formDlg" aria-labelledby="formTitle" closedby="closerequest">
  <form id="formEl" class="modal-form"></form>
</dialog>
<dialog class="modal confirm" id="confirmDlg" aria-labelledby="confirmTitle" aria-describedby="confirmText" closedby="any">
  <form method="dialog" class="confirm-form">
    <h2 id="confirmTitle"></h2>
    <p id="confirmText"></p>
    <div class="confirm-acts"><button class="btn" value="cancel" id="confirmCancel" autofocus>Annuler</button><button class="btn danger" value="ok" id="confirmOk">Confirmer</button></div>
  </form>
</dialog>

<div class="sr-only" role="status" id="announcer"></div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="drop" id="drop"><div><i data-lucide="file-spreadsheet" aria-hidden="true"></i>Déposez le fichier Excel pour l'analyser</div></div>

<script src="vendor/xlsx.full.min.js"></script>
<script src="vendor/chart.umd.min.js"></script>
<script src="vendor/lucide.min.js"></script>
<script src="core.js"></script>
<script src="store.js"></script>
<script src="forms.js"></script>
<script src="app.js"></script>
</body>
</html>
